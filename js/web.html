<!DOCTYPE html>
<html>
<head>
<title>Auth Project</title>

<style>
body {
    font-family: Arial;
    margin: 0;
    background: linear-gradient(lavender, lightblue, pink, violet, purple);
}

.container {
    display: none;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.box {
    background-color: rgb(230, 178, 230);
    padding: 25px;
    border-radius: 10px;
    width: 320px;
}

input, select, textarea {
    width: 100%;
    padding: 8px;
    margin-top: 10px;
}

button {
    padding: 10px;
    margin-top: 10px;
    border: none;
    cursor: pointer;
    background-color: green;
    color: white;
}

.error {
    color: red;
    font-size: 12px;
    height: 14px;
}

nav {
    background: #333;
    color: white;
    padding: 15px;
    display: flex;
    justify-content: space-between;
}

.content {
    padding: 20px;
}
</style>
</head>

<body>

<!-- REGISTER -->
<div id="registerPage" class="container" style="display:flex;">
<div class="box">
<h2>Register</h2>

<input type="text" id="name" placeholder="Full Name">
<small id="nameError" class="error"></small>

<input type="email" id="email" placeholder="Email">
<small id="emailError" class="error"></small>

<input type="text" id="phone" placeholder="Phone"
oninput="this.value=this.value.replace(/[^0-9]/g,'')">
<small id="phoneError" class="error"></small>

<input type="text" id="regUsername" placeholder="Username">
<small id="userError" class="error"></small>

<label>Date of Birth:</label>
<input type="date" id="dob">
<small id="dobError" class="error"></small>

<select id="gender">
<option value="">Select Gender</option>
<option>Male</option>
<option>Female</option>
</select>

<textarea id="address" placeholder="Address"></textarea>

<input type="password" id="regPassword" placeholder="Password">
<small id="passError" class="error"></small>

<button type="button" onclick="register()">Submit</button>
</div>
</div>

<!-- LOGIN -->
<div id="loginPage" class="container">
<div class="box">
<h2>Login</h2>

<input type="text" id="loginUsername" placeholder="Username">
<small id="loginUserError" class="error"></small>

<input type="password" id="loginPassword" placeholder="Password">
<small id="loginPassError" class="error"></small>

<button onclick="login()">Login</button>
<button onclick="clearData()">Cancel</button>
</div>
</div>

<!-- HOME -->
<div id="homePage">
<nav>
<h3>My Website</h3>
<button onclick="logout()">Logout</button>
</nav>

<div class="content">
<h2 id="welcomeText">Welcome!</h2>
<p>This is your landing page.</p>
</div>
</div>

<script>

function showPage(pageId) {
document.getElementById("registerPage").style.display = "none";
document.getElementById("loginPage").style.display = "none";
document.getElementById("homePage").style.display = "none";

if (pageId === "homePage") {
document.getElementById(pageId).style.display = "block";
} else {
document.getElementById(pageId).style.display = "flex";
}
}

function clearErrors() {
document.querySelectorAll(".error").forEach(e => e.innerText = "");
}

function register() {

clearErrors();

let name = document.getElementById("name").value.trim();
let email = document.getElementById("email").value.trim();
let phone = document.getElementById("phone").value.trim();
let username = document.getElementById("regUsername").value.trim();
let password = document.getElementById("regPassword").value.trim();

let valid = true;

let emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
let phonePattern = /^[0-9]{10}$/;

if (!name) {
document.getElementById("nameError").innerText = "Name required";
valid = false;
}

if (!email.match(emailPattern)) {
document.getElementById("emailError").innerText = "Invalid email";
valid = false;
}

if (!phone.match(phonePattern)) {
document.getElementById("phoneError").innerText = "10 digit phone only";
valid = false;
}

if (!username) {
document.getElementById("userError").innerText = "Username required";
valid = false;
}

if (password.length < 6) {
document.getElementById("passError").innerText = "Min 6 characters";
valid = false;
}

if (!valid) return;

let user = { name, email, phone, username, password };
localStorage.setItem("user", JSON.stringify(user));

showPage("loginPage");
}

function login() {

clearErrors();

let storedUser = JSON.parse(localStorage.getItem("user"));

let username = document.getElementById("loginUsername").value.trim();
let password = document.getElementById("loginPassword").value.trim();

let valid = true;

if (!username) {
document.getElementById("loginUserError").innerText = "Enter username";
valid = false;
}

if (!password) {
document.getElementById("loginPassError").innerText = "Enter password";
valid = false;
}

if (!valid) return;

if (storedUser && username === storedUser.username && password === storedUser.password) {
document.getElementById("welcomeText").innerText = "Welcome " + storedUser.name;
showPage("homePage");
} else {
document.getElementById("loginPassError").innerText = "Invalid credentials";
}
}

function clearData() {
document.getElementById("loginUsername").value = "";
document.getElementById("loginPassword").value = "";
clearErrors();
}

function logout() {
showPage("loginPage");
}

showPage("registerPage");

</script>

</body>
</html>
