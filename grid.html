<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            height: 70vh;
            display: flex;
            justify-content: center;
            border-radius: 20px;
        }
        input{
            width: 400px;
            padding: 30px;
            border:10px solid rgb(213, 130, 130);
            border-radius: 10px;
        }
        .container{
            border: 2px solid rgb(230, 179, 179);
            padding: 30px;
        }
        #button-container{
            display: grid;
            grid-template-columns: auto auto auto auto;
            row-gap: 10px;
            column-gap: 10px;
            margin-top: 50px;
        }
        #button-container div{
            border: 2px solid rgb(164, 142, 142);
            text-align: center;
            padding: 20px;
            border-radius: 10px;
        }
        #button-container div:nth-child(1){
            
        }
    </style>
</head>
<body>
    <div class="container">
        <input type="number" readonly="0">
        <div id="button-container">
            <div>C</div>
            <div>log</div>
            <div>1/2</div>
            <div>AC</div>
                 <div>SIN</div>
                 <div>COS</div>
                 <div>TAN</div>
                 <div>+</div>
                 <div>7</div>
                 <div>8</div>
                 <div>9</div>
                 <div>-</div>
                 <div>4</div>
                 <div>5</div>
                 <div>6</div>
                 <div>*</div>
                 <div>3</div>
                 <div>2</div>
                 <div>1</div>
                 <div>%</div>
        </div>
    </div>
</body>
</html>
